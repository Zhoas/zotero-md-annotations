name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build XPI
        run: |
          python build.py

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: zotero-md-annotations-*.xpi
          generate_release_notes: true
